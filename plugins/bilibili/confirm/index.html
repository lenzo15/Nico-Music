<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>导入哔哩哔哩合集</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;
      background: #f6f6f9; color: #26252b; font: 14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif; }
    main { flex: 1; min-height: 0; overflow: auto; }
    small { color: #777982; font-size: 12px; }
    h1 { margin: 4px 0 6px; font-size: 18px; font-weight: 600; }
    p { margin: 0; color: #68656c; overflow-wrap: anywhere; }
    footer { display: flex; flex: none; justify-content: flex-end; gap: 8px; }
    button { min-height: 36px; min-width: 72px; padding: 8px 14px; border: 1px solid #3c3c4318; border-radius: 12px;
      background: white; color: inherit; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
    #cancel:hover { background: #ededf2; }
    #accept { border-color: transparent; background: linear-gradient(#e84a57, #d63a49); color: white; font-weight: 600;
      box-shadow: 0 3px 8px #d63a4917; }
    #accept:hover:not(:disabled) { background: #cc3444; }
    button:focus-visible { outline: 2px solid #c64b63; outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main><small>哔哩哔哩</small><h1>导入这个合集？</h1><p id="summary" aria-live="polite"></p></main>
  <footer><button id="cancel">取消</button><button id="accept" disabled>导入</button></footer>
  <script>
    const host = "https://studio.bilimusic.local";
    const send = action => parent.postMessage("collection-" + action, host);
    window.addEventListener("message", e => {
      if (e.source !== parent || e.origin !== host || e.data?.type !== "collection-preview") return;
      const {count, destination, play} = e.data;
      document.querySelector("#summary").textContent = `将 ${count} 首歌曲加入「${destination}」${play ? "，并从第一首开始播放" : ""}。`;
      const accept = document.querySelector("#accept");
      accept.disabled = false;
      accept.textContent = play ? "导入并播放" : "确认导入";
      document.querySelector("#cancel").focus();
    });
    document.querySelector("#cancel").onclick = () => send("cancel");
    document.querySelector("#accept").onclick = () => send("accept");
    window.onkeydown = e => { if (e.key === "Escape") { e.preventDefault(); send("cancel"); } };
    send("ready");
  </script>
</body>
</html>
