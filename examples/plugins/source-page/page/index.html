<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>来源页面示例</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <h2>本地来源设置</h2>
  <p>这是一个离线示例，不会登录任何平台，也不接收账号或密码。</p>
  <p id="status" role="status">正在读取状态…</p>
  <button id="toggle" type="button" disabled>切换模拟登录状态</button>
</body>
</html>
